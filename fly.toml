# fly.toml — Agent OS always-on (mobiel bereikbaar, ook laptop uit)
# Deploy:  fly launch --no-deploy   (één keer), daarna:  fly deploy
# Secrets zetten (NOOIT in dit bestand):
#   fly secrets set AGENTOS_PASSWORD="<jouw-sterk-wachtwoord>"
#   fly secrets set ANTHROPIC_API_KEY="sk-..."  (en de rest van je .env)
#   fly secrets set OBSIDIAN_VAULT_PATH="/app/data"  # of leeg als niet nodig
#   fly secrets set AGENTOS_SECURE_COOKIE="1"        # HTTPS-on (Fly doet TLS)
#   fly secrets set HOST="0.0.0.0" PORT="8080"

app = "agent-os"
primary_region = "ams"   # Amsterdam — dicht bij NL, lage latency op je telefoon

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  AGENTOS_DB_PATH = "/app/data/agentos.db"
  AGENTOS_SECURE_COOKIE = "1"

[mounts]
  source = "agentos_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # altijd aan → mobiel bereikbaar zonder laptop
  processes = ["app"]

  [[http_service.concurrency]]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = "rolling"

# Volume aanmaken vóór eerste deploy:
#   fly volumes create agentos_data --region ams --size 1
